<style>:root{--p:#2E5E8C;--bg:#f6f7f9;--card:#fff;--text:#14171c;--dim:#5d6570;--line:#e3e6ea;--ok:#1f9d55}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--text:#eef0f3;--dim:#a2a9b3;--line:#2b3038}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;line-height:1.75;font-size:16px}
main{max-width:720px;margin:0 auto;padding:16px}
header.top{background:var(--p);color:#fff;padding:20px 16px}
header.top .in{max-width:720px;margin:0 auto}
header.top a{color:#fff;opacity:.9;font-size:14px;text-decoration:none}
h1{font-size:24px;line-height:1.4;margin:6px 0 4px}
.lead{font-size:15px;opacity:.95;margin:0}
h2{font-size:18px;margin:28px 0 10px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.qno{font-size:13px;font-weight:700;color:var(--p)}
.qtext{margin:4px 0 10px;font-weight:600}
ol.ch{list-style:none;padding:0;margin:0}
ol.ch li{padding:8px 10px 8px 2.2em;text-indent:-1.6em;border-top:1px solid var(--line)}
details{margin-top:10px;border-radius:10px;background:var(--bg)}
summary{cursor:pointer;padding:10px 12px;font-weight:700;color:var(--p);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▶ ";font-size:11px}
details[open] summary::before{content:"▼ "}
.ans{padding:0 12px 12px}
.ans .ok{color:var(--ok);font-weight:700}
.chapters a{display:flex;justify-content:space-between;gap:12px;padding:14px 4px;border-top:1px solid var(--line);color:var(--text);text-decoration:none}
.chapters a:first-child{border-top:0}
.chapters .n{color:var(--dim);white-space:nowrap}
.cta{background:var(--card);border:2px solid var(--p);border-radius:14px;padding:16px;margin:28px 0}
.cta b{display:block;font-size:17px;margin-bottom:6px}
.btn{display:inline-block;margin-top:10px;background:var(--p);color:#fff;padding:12px 18px;border-radius:999px;text-decoration:none;font-weight:700}
.pager{display:flex;justify-content:space-between;gap:12px;margin:20px 0}
.pager a{color:var(--p);font-weight:700;text-decoration:none}
footer{max-width:720px;margin:0 auto;padding:8px 16px 40px;color:var(--dim);font-size:13px}
footer a{color:var(--dim)}</style>
